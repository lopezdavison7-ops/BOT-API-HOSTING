<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | BOT-API-Hosting</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="nav-logo">
          <span class="logo-icon">🤖</span>
          <span class="logo-text">BOT-API<span class="accent">-Hosting</span></span>
        </div>
        <h1>Iniciar Sesión</h1>
        <p>Accede a tu panel de hosting</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-error" id="formError"></div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
          Iniciar Sesión
        </button>
      </form>

      <div class="auth-footer">
        <p>¿No tienes cuenta? <a href="/register.html">Regístrate aquí</a></p>
      </div>
    </div>

    <div class="auth-footer-text">
      <p>Powered by <strong>Alex Aguilar Gutiérrez</strong></p>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const formError = document.getElementById('formError');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      formError.textContent = '';
      formError.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Iniciando sesión...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          if (data.user.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/dashboard.html';
          }
        } else {
          formError.textContent = data.error || 'Error al iniciar sesión';
          formError.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Iniciar Sesión';
        }
      } catch (error) {
        formError.textContent = 'Error de conexión con el servidor';
        formError.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Iniciar Sesión';
      }
    });

    if (localStorage.getItem('token')) {
      const user = JSON.parse(localStorage.getItem('user'));
      if (user && user.role === 'admin') {
        window.location.href = '/admin.html';
      } else {
        window.location.href = '/dashboard.html';
      }
    }
  </script>
</body>
</html>
