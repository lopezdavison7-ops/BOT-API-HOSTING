<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | BOT-API-Hosting</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="nav-logo">
          <span class="logo-icon">🤖</span>
          <span class="logo-text">BOT-API<span class="accent">-Hosting</span></span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-item active">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="/coins.html" class="nav-item">
          <span class="nav-icon">💰</span> Coins
        </a>
        <a href="#" class="nav-item" id="profileLink">
          <span class="nav-icon">👤</span> Perfil
        </a>
        <a href="#" class="nav-item" id="logoutBtn">
          <span class="nav-icon">🚪</span> Cerrar Sesión
        </a>
      </nav>
      <div class="sidebar-footer">
        <p>Powered by <strong>Alex Aguilar Gutiérrez</strong></p>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <h1>Dashboard</h1>
        </div>
        <div class="top-bar-right">
          <div class="user-coins">
            <span class="coin-icon">🪙</span>
            <span id="userCoins">0</span> coins
          </div>
          <div class="user-info">
            <span id="userName">Usuario</span>
          </div>
        </div>
      </header>

      <div class="content-area">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">🖥️</div>
            <div class="stat-info">
              <span class="stat-value" id="totalServers">0</span>
              <span class="stat-label">Servidores</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">▶️</div>
            <div class="stat-info">
              <span class="stat-value" id="activeServers">0</span>
              <span class="stat-label">Activos</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🪙</div>
            <div class="stat-info">
              <span class="stat-value" id="balanceCoins">0</span>
              <span class="stat-label">Coins</span>
            </div>
          </div>
        </div>

        <div class="section-header">
          <h2>Mis Servidores</h2>
          <button class="btn btn-primary" id="buyServerBtn">+ Comprar Servidor</button>
        </div>

        <div class="servers-grid" id="serversGrid">
          <div class="loading-spinner">Cargando servidores...</div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="buyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Comprar Servidor</h2>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="buyForm">
          <div class="form-group">
            <label for="serverName">Nombre del Servidor</label>
            <input type="text" id="serverName" placeholder="Mi Bot de WhatsApp" required maxlength="100">
          </div>

          <div class="form-group">
            <label>Selecciona un Plan</label>
            <div class="plans-grid" id="plansGrid">
              <div class="loading-spinner">Cargando planes...</div>
            </div>
          </div>

          <div class="form-error" id="buyError"></div>

          <button type="submit" class="btn btn-primary btn-block" id="buyBtn">
            Comprar Servidor
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
