<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse | BOT-API-Hosting</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="nav-logo">
          <span class="logo-icon">🤖</span>
          <span class="logo-text">BOT-API<span class="accent">-Hosting</span></span>
        </div>
        <h1>Crear Cuenta</h1>
        <p>Comienza a hospedar tus bots hoy</p>
      </div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="username">Nombre de Usuario</label>
          <input type="text" id="username" name="username" placeholder="mi_usuario" required minlength="3" maxlength="50">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" required>
        </div>

        <div class="form-error" id="formError"></div>
        <div class="form-success" id="formSuccess"></div>

        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
          Crear Cuenta
        </button>
      </form>

      <div class="auth-footer">
        <p>¿Ya tienes cuenta? <a href="/login.html">Inicia sesión aquí</a></p>
      </div>
    </div>

    <div class="auth-footer-text">
      <p>Powered by <strong>Alex Aguilar Gutiérrez</strong></p>
    </div>
  </div>

  <script>
    const registerForm = document.getElementById('registerForm');
    const formError = document.getElementById('formError');
    const formSuccess = document.getElementById('formSuccess');
    const registerBtn = document.getElementById('registerBtn');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      formError.textContent = '';
      formError.style.display = 'none';
      formSuccess.textContent = '';
      formSuccess.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        formError.textContent = 'Las contraseñas no coinciden';
        formError.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        formError.textContent = 'La contraseña debe tener al menos 6 caracteres';
        formError.style.display = 'block';
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = 'Creando cuenta...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          formSuccess.textContent = '¡Cuenta creada exitosamente! Redirigiendo...';
          formSuccess.style.display = 'block';
          
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1500);
        } else {
          formError.textContent = data.error || 'Error al crear la cuenta';
          formError.style.display = 'block';
          registerBtn.disabled = false;
          registerBtn.textContent = 'Crear Cuenta';
        }
      } catch (error) {
        formError.textContent = 'Error de conexión con el servidor';
        formError.style.display = 'block';
        registerBtn.disabled = false;
        registerBtn.textContent = 'Crear Cuenta';
      }
    });

    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
